<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horn Gun: Crossing Defense</title>
<meta name="description" content="A small free browser game: keep raccoons, geese and deer off a rail crossing with a non-lethal Portable Train Horn Gun. The stun falls off with distance by the inverse-square law. By Train Horn.">
<link rel="icon" href="icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #10141a; color: #dfe6ee; font: 15px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; padding: 12px 16px; box-sizing: border-box; }
  canvas { display: block; width: min(100%, calc((100vh - 70px) * 16 / 9)); aspect-ratio: 16 / 9; background: #5f8f3e; cursor: crosshair; touch-action: none; border-radius: 6px; box-shadow: 0 6px 30px rgba(0,0,0,.5); }
  footer { margin-top: 10px; text-align: center; font-size: 13px; color: #9fb0c2; }
  a { color: #7fc8ff; }
</style>
</head>
<body>
<main>
  <canvas id="game" width="1280" height="720" aria-label="Horn Gun: Crossing Defense game"></canvas>
  <footer>
    Horn Gun: Crossing Defense, by <a href="https://train-horn.com/">Train Horn</a>.
    The falloff model is the one used by the decibel-at-distance calculator on train-horn.com.
    Sound effects generated with ElevenLabs for Train Horn.
    <a href="https://github.com/train-horn/horn-gun-crossing-defense">Source (MIT)</a>
  </footer>
</main>
<script src="js/logic.js"></script>
<script src="js/game.js"></script>
</body>
</html>
